[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opd-state"
version = "0.1.0"
description = "Rollout-source distillation and state diagnostics"
requires-python = ">=3.12"
dependencies = ["hydra-core>=1.3,<1.4", "omegaconf>=2.3,<2.4"]

[project.optional-dependencies]
training = ["torch>=2.7,<2.8", "transformers==4.57.6", "tensordict>=0.10,<0.11"]
test = ["pytest>=8,<10", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
