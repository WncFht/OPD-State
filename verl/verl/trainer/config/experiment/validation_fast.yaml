# @package _global_
# Evaluation-only candidate settings. Keep the learner/rollout training budget.
# The math launcher defaults val_batch_size to 32; override it explicitly for
# larger submission windows (for example data.val_batch_size=64 on eight GPUs).
actor_rollout_ref:
  rollout:
    generation_eval_max_num_seqs: 64
    generation_eval_max_num_batched_tokens: 32768
    generation_eval_memory_utilization: 0.65
    generation_eval_enforce_eager: false
    generation_eval_engine_kwargs:
      compilation_config:
        custom_ops: [all]
        cudagraph_capture_sizes: [1, 2, 4, 8, 16, 32, 64]

trainer:
  validation_metrics_mode: math_exact
  validation_kl:
    enabled: true
    balance_records: true
    position_chunk_size: 1024
    vocab_chunk_size: 151665
