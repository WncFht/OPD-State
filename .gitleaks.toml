[extend]
useDefault = true

# Upstream dataset routing examples contain the word "key", not credentials.
[[allowlists]]
description = "Upstream geometry dataset routing examples"
condition = "AND"
regexTarget = "line"
paths = ['''^(training/one-shot-opd/)?verl/verl/(trainer/config/distillation/distillation\.yaml|workers/config/distillation\.py)$''']
regexes = ['''^\s*#?\s*\+distillation\.teacher_models\.teacher_model[12]\.key=hiyouga/geometry3k\s*$''']

# DataProto uses this literal as an internal dictionary key.
[[allowlists]]
description = "Upstream DataProto padding dictionary key"
condition = "AND"
regexTarget = "match"
paths = ['''^(training/one-shot-opd/)?verl/verl/protocol\.py$''']
regexes = ['''^_padding_size_key = "_padding_size_key_x123d"\s*$''']

# This field is SHA-256(vocabulary + chat template + special token IDs).
[[allowlists]]
description = "SHA-256 tokenizer metadata in experiment cache manifests"
condition = "AND"
regexTarget = "line"
paths = ['''^docs/experiment/results/[^/]+/cache-manifest\.json$''']
regexes = ['''^\s*"tokenizer_signature"\s*:\s*"[a-f0-9]{64}"\s*,?\s*$''']

# The fixed-prefix input audit records the same computed tokenizer SHA-256.
[[allowlists]]
description = "Computed tokenizer SHA-256 in the fixed-prefix CPU audit"
condition = "AND"
regexTarget = "line"
paths = ['''^docs/experiment/results/native-rollout/prefix-bank-cpu\.json$''']
regexes = ['''^\s*"tokenizer_signature"\s*:\s*"[a-f0-9]{64}"\s*,?\s*$''']

# These are verified checksums of the raw KL response-token evidence.
[[allowlists]]
description = "Raw response SHA-256 in the audited short KL GPU results"
condition = "AND"
regexTarget = "line"
paths = ['''^docs/experiment/results/native-rollout/validation-kl-canary/(kl-independent-audit|kl-summary)\.json$''']
regexes = ['''^\s*"tokens_sha256"\s*:\s*"[a-f0-9]{64}"\s*,?\s*$''']

# The long-response gate binds these fields to its original token JSONL bytes.
[[allowlists]]
description = "Verified raw-token SHA-256 in long-response KL audit metadata"
condition = "AND"
regexTarget = "line"
paths = ['''^docs/experiment/results/native-rollout/validation-kl-long/(kl-independent-audit|kl-summary)\.json$''']
regexes = ['''^\s*"tokens_sha256"\s*:\s*"[a-f0-9]{64}"\s*,?\s*$''']

[[allowlists]]
description = "Verified original token JSONL checksum in the long KL collection receipt"
condition = "AND"
regexTarget = "line"
paths = ['''^docs/experiment/results/native-rollout/validation-kl-long/kl-collection\.json$''']
regexes = ['''^\s*"[^"]*/runs/native-validation-kl-long-20261019-v2/validation/kl/kl-tokens-step-2\.jsonl"\s*:\s*"[a-f0-9]{64}"\s*,?\s*$''']

# Independently checked against the original step2/4 token JSONL files.
[[allowlists]]
description = "Verified response checksums in periodic validation KL metadata"
condition = "AND"
regexTarget = "line"
paths = ['''^docs/experiment/results/native-rollout/validation-performance/periodic/step-(2|4)/(kl-independent-audit|kl-summary)\.json$''']
regexes = ['''^\s*"tokens_sha256"\s*:\s*"[a-f0-9]{64}"\s*,?\s*$''']

[[allowlists]]
description = "Verified original token checksum for periodic step2 collection"
condition = "AND"
regexTarget = "line"
paths = ['''^docs/experiment/results/native-rollout/validation-performance/periodic/step-2/kl-collection\.json$''']
regexes = ['''^\s*"[^" ]*/runs/validation-periodic-fast-20261019-v1/validation/kl/kl-tokens-step-2\.jsonl"\s*:\s*"[a-f0-9]{64}"\s*,?\s*$''']

[[allowlists]]
description = "Verified original token checksum for periodic step4 collection"
condition = "AND"
regexTarget = "line"
paths = ['''^docs/experiment/results/native-rollout/validation-performance/periodic/step-4/kl-collection\.json$''']
regexes = ['''^\s*"[^" ]*/runs/validation-periodic-fast-20261019-v1/validation/kl/kl-tokens-step-4\.jsonl"\s*:\s*"[a-f0-9]{64}"\s*,?\s*$''']

# Verified against the raw 9,120-response optimized full-gate token JSONL.
[[allowlists]]
description = "Verified response checksums in the optimized full validation KL metadata"
condition = "AND"
regexTarget = "line"
paths = ['''^docs/experiment/results/native-rollout/validation-performance/full/(kl-independent-audit|kl-summary)\.json$''']
regexes = ['''^\s*"tokens_sha256"\s*:\s*"[a-f0-9]{64}"\s*,?\s*$''']

[[allowlists]]
description = "Verified original token checksum for optimized full validation collection"
condition = "AND"
regexTarget = "line"
paths = ['''^docs/experiment/results/native-rollout/validation-performance/full/kl-collection\.json$''']
regexes = ['''^\s*"[^" ]*/runs/validation-full-fast-20261019-v1/validation/kl/kl-tokens-step-2\.jsonl"\s*:\s*"[a-f0-9]{64}"\s*,?\s*$''']

# The complete gate independently verifies the same fields against raw bytes.
[[allowlists]]
description = "Verified raw-token SHA-256 in complete validation KL audit metadata"
condition = "AND"
regexTarget = "line"
paths = ['''^docs/experiment/results/native-rollout/validation-kl-full/(kl-independent-audit|kl-summary)\.json$''']
regexes = ['''^\s*"tokens_sha256"\s*:\s*"[a-f0-9]{64}"\s*,?\s*$''']

[[allowlists]]
description = "Verified original token JSONL checksum in the complete KL collection receipt"
condition = "AND"
regexTarget = "line"
paths = ['''^docs/experiment/results/native-rollout/validation-kl-full/kl-collection\.json$''']
regexes = ['''^\s*"[^"]*/runs/native-validation-kl-full-20261019-v2/validation/kl/kl-tokens-step-2\.jsonl"\s*:\s*"[a-f0-9]{64}"\s*,?\s*$''']
